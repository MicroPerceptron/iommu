[package]
name = "iommu"
version = "0.7.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/MicroPerceptron/iommu"

[dependencies]
heapless = { version = "0.9.2", default-features = false }
memory_addr = { version = "0.4.1", default-features = false }
fdt = { version = "0.1.5", default-features = false }
acpi = { version = "6.1.1", default-features = false }
kore-memory = { git = "https://github.com/MicroPerceptron/kore-memory.git", default-features = false }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { version = "0.15.4", default-features = false }

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = { version = "11.2.0", default-features = false }
aarch64-cpu-ext = { version = "0.1.4", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = { version = "0.16.0", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
